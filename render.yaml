# Render Blueprint — deploys the FastAPI backend on the free tier.
# Docs: https://render.com/docs/blueprint-spec
# Deploy: push to GitHub → Render → New → Blueprint → pick repo. Done.
services:
  - type: web
    name: rwanda-compass-api
    runtime: python
    plan: free
    rootDir: ./
    buildCommand: pip install -r requirements.txt
    # Render injects $PORT; bind 0.0.0.0 (required in Render containers).
    startCommand: uvicorn server.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      # Lock CORS to the deployed frontend + local dev.
      # Add your exact Vercel production URL(s) here (comma-separated).
      - key: FRONTEND_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://rwako.vercel.app
